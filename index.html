 <!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>أداة اللعبة — فريقان</title>
  <style>
    :root{
      --bg1:#071427; --bg2:#071a2f; --card:#0f2233; --accent:#7b61ff; --accent2:#4ee1a1; --danger:#ff5c7c; --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
      --text:#e6eef8;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);font-family:Inter, 'Segoe UI', Tahoma, sans-serif}
    .wrap{max-width:1100px;margin:18px auto;padding:18px;display:grid;grid-template-columns:1fr 380px;gap:18px}
    .card{background:linear-gradient(180deg,var(--card), rgba(7,20,36,.6));border-radius:14px;padding:16px;box-shadow:0 8px 30px rgba(2,6,23,.6)}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px}
    h1{font-size:20px;margin:0}
    .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .team{border-radius:12px;padding:16px;position:relative;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent)}
    .team h2{margin:0 0 8px;font-size:18px}
    .score{font-weight:900;font-size:46px}
    .controls{display:flex;gap:8px;margin-top:12px}
    button{background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;padding:10px 12px;border-radius:10px;color:#021322;font-weight:800;cursor:pointer}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,.06);color:var(--text)}
    .big-timer{font-size:96px;font-weight:900;text-align:center;padding:18px 6px}
    .meta{display:flex;gap:8px;align-items:center;justify-content:center;color:#9fb0c8;margin-top:6px}
    .active{box-shadow:0 0 0 6px rgba(123,97,255,.06), inset 0 -10px 30px rgba(123,97,255,.06)}
    .danger{color:var(--danger);animation:blink .9s infinite}
    @keyframes blink{50%{opacity:.4}}
    .floating-plus{position:absolute;right:12px;top:10px;padding:6px 10px;border-radius:8px;font-weight:900;color:#021322;background:linear-gradient(90deg,var(--accent2),#fff);transform:translateY(-18px);opacity:0;transition:all .6s cubic-bezier(.2,.9,.3,1)}
    .plus-show{transform:translateY(-70px);opacity:1}
    .win-layer{position:fixed;inset:0;pointer-events:none;z-index:60}
    .confetti{position:absolute;width:10px;height:18px;opacity:.95;animation:fall 1.6s linear forwards}
    @keyframes fall{to{transform:translateY(100vh) rotate(600deg);opacity:0}}
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,23,.6);z-index:70}
    .modal.show{display:flex}
    .modal-card{width:360px;background:linear-gradient(180deg,#0b1b2b,#071428);padding:18px;border-radius:12px;text-align:center}
    .modal-card h3{margin:0 0 8px}
    .modal-actions{display:flex;gap:10px;margin-top:12px}
    .pulse{animation:pulse 0.9s ease-in-out}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
    .flash{animation:flash 0.5s}
    @keyframes flash{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
    .shake{animation:shake 0.6s}
    @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-8px)}100%{transform:translateX(0)}}
    .persistent{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:12px;border-radius:10px;color:#9fb0c8}
    .right-col{display:flex;flex-direction:column;gap:12px}
    .small{font-size:13px;color:#9fb0c8}
    footer.small{text-align:center;color:#7f94ab;margin-top:12px}

    /* Responsive */
    @media(max-width:920px){.wrap{grid-template-columns:1fr;}.big-timer{font-size:64px}}
    @media(max-width:420px){.big-timer{font-size:48px}.score{font-size:36px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div>
          <h1>My Results Tool</h1>
          <div class="small">Lotfy_Galal</div>
        </div>
        <div class="persistent" id="persistentUI">النتيجة المتراكمة: الفريق الاول 0 — الفريق الثانى 0</div>
      </header>

      <div class="teams" style="margin-top:18px">
        <div class="team" id="team1Card">
          <div class="floating-plus" id="t1plus">+1 بونص</div>
          <h2>الفريق الاولــــــــــ</h2>
          <div class="score" id="score1">0</div>
          <div class="controls">
            <button id="btn1">نقطة اساسية</button>
            <button class="ghost" id="manual1">Bonus +1</button>
          </div>
        </div>

        <div class="team" id="team2Card">
          <div class="floating-plus" id="t2plus">+1 بونص</div>
          <h2>الفريق الثانــــــــــــ</h2>
          <div class="score" id="score2">0</div>
          <div class="controls">
            <button id="btn2">نقطة اساسية</button>
            <button class="ghost" id="manual2">Bonus +1</button>
          </div>
        </div>
      </div>

      <div style="margin-top:18px" class="card">
        <div class="big-timer" id="mainTimer">08</div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
          <button class="big-btn" id="startBtn">ابدأ/استكمل</button>
          <button class="big-btn ghost" id="restartBtn">إعادة العد</button>
          <button class="big-btn ghost" id="endBtn">إنهاء اللعبة</button>
        </div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;justify-content:center">
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <h3>النقاط الآن</h3>
        <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
          <div style="flex:1">
            <div style="font-size:26px;font-weight:800">الفريق الاول: <span id="now1">0</span></div>
            <div style="font-size:26px;font-weight:800">الفريق الثانى: <span id="now2">0</span></div>
          </div>
        </div>

        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="ghost" id="toggleSound">ايقاف الصوت</button>
          <button class="ghost" id="resetPersist">اعادة تعيين النتيجة المتراكمة</button>
        </div>
      </div>

      <div class="card">
        <h3>سجل الأحداث</h3>
        <div id="log" style="max-height:220px;overflow:auto;color:var(--text);font-size:13px;padding-top:8px;opacity:.9"></div>
      </div>
    </div>
  </div>

  <!-- Modal after each round -->
  <div class="modal" id="roundModal">
    <div class="modal-card">
      <h3>انتهى الدور</h3>
      <p>لمن تُعطى النقطة؟</p>
      <div class="modal-actions">
        <button id="give1">الفريق الاولــــــــــ</button>
        <button id="give2">الفريق الثانــــــــــــى</button>
      </div>
    </div>
  </div>

  <!-- Big message -->
  <div id="bigMsg" style="position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:linear-gradient(90deg,var(--accent),var(--accent2));color:#021322;padding:18px 28px;border-radius:12px;font-weight:900;font-size:28px;display:none;z-index:80"></div>

  <div class="win-layer" id="winLayer"></div>

  <!-- Sounds (from internet) -->
  <audio id="tick" src="https://www.soundjay.com/buttons/sounds/beesp-01a.mp3" preload="auto"></audio>
  <audio id="tick2" src="https://www.soundjay.com/buttons/sounds/besep-02.mp3" preload="auto"></audio>
  <audio id="point" src="https://www.soundjay.com/misc/sounds/besll-ringing-05.mp3" preload="auto"></audio>
  <audio id="popupSound" src="https://www.soundjay.com/button/sousnds/button-3.mp3" preload="auto"></audio>
  <audio id="endSound" src="https://www.soundjay.com/misc/sounds/sbell-ringing-01.mp3" preload="auto"></audio>
  <audio id="dangerSound" src="https://www.youtube.com/watch?v=nsTQMvd-k7y4" preload="auto"></audio>

  <script>
    // Elements
    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');
    const now1El = document.getElementById('now1');
    const now2El = document.getElementById('now2');
    const persistentUI = document.getElementById('persistentUI');
    const t1plus = document.getElementById('t1plus');
    const t2plus = document.getElementById('t2plus');
    const team1Card = document.getElementById('team1Card');
    const team2Card = document.getElementById('team2Card');
    const mainTimerEl = document.getElementById('mainTimer');
    const metaLine = document.getElementById('metaLine');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const endBtn = document.getElementById('endBtn');
    const logEl = document.getElementById('log');
    const roundModal = document.getElementById('roundModal');
    const give1 = document.getElementById('give1');
    const give2 = document.getElementById('give2');
    const bigMsg = document.getElementById('bigMsg');
    const winLayer = document.getElementById('winLayer');
    const toggleSound = document.getElementById('toggleSound');
    const resetPersist = document.getElementById('resetPersist');

    // Sounds
    const sndTick = document.getElementById('tick');
    const sndTick2 = document.getElementById('tick2');
    const sndPoint = document.getElementById('point');
    const sndPopup = document.getElementById('popupSound');
    const sndEnd = document.getElementById('endSound');
    const sndDanger = document.getElementById('dangerSound');

    // State
    let score1 = 0, score2 = 0;
    let persistent1 = 0, persistent2 = 0;
    let turn = 1; // 1 or 2
    let roundRemaining = 8;
    let timerInterval = null;
    let bonusOpen = false;
    let soundEnabled = true;

    const PERSIST_KEY = 'two_team_persistent_v3';

    // Load persistent
    function loadPersistent(){
      try{
        const raw = localStorage.getItem(PERSIST_KEY);
        if(raw){const obj = JSON.parse(raw);persistent1 = obj.p1||0; persistent2 = obj.p2||0;}
      }catch(e){console.warn(e)}
      updatePersistentUI();
    }
    function savePersistent(){
      localStorage.setItem(PERSIST_KEY, JSON.stringify({p1:persistent1,p2:persistent2}));
      updatePersistentUI();
    }
    function resetPersistent(){
      if(!confirm('هل تريد فعلاً إعادة تعيين النتيجة المتراكمة؟')) return;
      persistent1 = 0; persistent2 = 0; savePersistent(); addLog('تم إعادة تعيين النتيجة المتراكمة');
    }
    function updatePersistentUI(){
      persistentUI.textContent = ` التراكمى: الفريق الاول ${persistent1} — الفريق الثانى ${persistent2}`;
    }

    // UI updates
    function updateUI(){
      score1El.textContent = score1; score2El.textContent = score2;
      now1El.textContent = score1; now2El.textContent = score2;
      mainTimerEl.textContent = String(roundRemaining).padStart(2,'0');
      metaLine.textContent = `دور: الفريق ${turn}`;
      team1Card.classList.toggle('active', turn===1);
      team2Card.classList.toggle('active', turn===2);
    }

    function addLog(txt){
      const d = new Date().toLocaleTimeString();
      const el = document.createElement('div'); el.textContent = `${d} — ${txt}`; logEl.prepend(el);
    }

    // effects
    function showPlus(el){ el.classList.add('plus-show'); setTimeout(()=>el.classList.remove('plus-show'),900); }
    function flashScore(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),450); }
    function shakeScreen(){ document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),700); }

    // sound helpers
    function play(s){ if(!soundEnabled || !s) return; try{ s.currentTime = 0; s.play(); }catch(e){} }

    // Manual point buttons (under each team) - add point, reset timer to full and stop
    document.getElementById('manual1').addEventListener('click', ()=>{ score1++;  savePersistent(); addLog('نقطة يدوية -> الفريق الاول'); flashScore(score1El); showPlus(t1plus); play(sndPoint); roundRemaining = 8; stopTimer(); updateUI(); });
    document.getElementById('manual2').addEventListener('click', ()=>{ score2++;  savePersistent(); addLog('نقطة يدوية -> الفريق الثانى'); flashScore(score2El); showPlus(t2plus); play(sndPoint); roundRemaining = 8; stopTimer(); updateUI(); });

    // quick +1 buttons near team
    document.getElementById('btn1').addEventListener('click', ()=>{ score1++; addLog('نقطة -> الفريق الاول'); play(sndPoint); roundRemaining = 8; stopTimer(); updateUI(); });
    document.getElementById('btn2').addEventListener('click', ()=>{ score2++; addLog('نقطة -> الفريق الثانى'); play(sndPoint); roundRemaining = 8; stopTimer(); updateUI(); });

    // Round end modal choices
    give1.addEventListener('click', ()=>{ givePoint(1); });
    give2.addEventListener('click', ()=>{ givePoint(2); });

    // Start / resume and restart
    startBtn.addEventListener('click', ()=>{ if(timerInterval) { stopTimer(); startBtn.textContent = 'ابدأ/استكمل'; } else { startTimer(); startBtn.textContent = 'إيقاف'; } play(sndPopup); });
    restartBtn.addEventListener('click', ()=>{ roundRemaining = 8; updateUI(); addLog('إعادة العد إلى 8'); play(sndPopup); });

    function startTimer(){
      if(timerInterval) return; // already running
      timerInterval = setInterval(()=>{
        roundRemaining--;
        // play tick
        if(roundRemaining>0){ if(roundRemaining<=3) play(sndDanger); else play(sndTick); }
        if(roundRemaining<=3) mainTimerEl.classList.add('danger'); else mainTimerEl.classList.remove('danger');
        if(roundRemaining<=0){
          // stop and show modal to ask who gets point
          stopTimer();
          // show big message + sound + shake
          showBigMessage('انتهى الدور!');
          play(sndEnd);
          shakeScreen();
          // open modal
          setTimeout(()=>{ roundModal.classList.add('show'); play(sndPopup); }, 350);
        }
        updateUI();
      },1000);
    }
    function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; startBtn.textContent='ابدأ/استكمل'; } }

    function givePoint(team){
      roundModal.classList.remove('show');
      if(team===1){ score1++; showPlus(t1plus); flashScore(score1El); addLog('بونص -> الفريق الاول'); }
      else { score2++; persistent2++; showPlus(t2plus); flashScore(score2El); addLog('بونص -> الفريق الثانى'); }
      savePersistent(); play(sndPoint);
      // next turn and reset timer but don't auto-start — user will press استكمل
      turn = (turn===1)?2:1;
      roundRemaining = 8;
      updateUI();
      // show little confirmation
      showBigMessage('تم تسجيل النقطة', 900);
    }

    // End game
    endBtn.addEventListener('click', ()=>{
      stopTimer();
      let winner=null; if(score1>score2) winner=1; else if(score2>score1) winner=2;
      if(winner){ addLog(`انتهت اللعبة. الفائز: الفريق ${winner}`); play(sndPoint); showConfetti(); showBigMessage(`فاز الفريق ${winner}`, 1800); }
      else{ addLog('انتهت اللعبة. تعادل'); showBigMessage('انتهى: تعادل',1200); }
      // add current game to persistent totals
      persistent1 += score1; persistent2 += score2; savePersistent();
      // show alert summary
      setTimeout(()=>{ alert(`النتيجة النهائية
الفريق الاول: ${score1}
الفريق الثانى: ${score2}`); },700);
      // reset current scores
      score1=0; score2=0; roundRemaining=8; updateUI();
    });

    // utilities
    function showBigMessage(txt, timeout=600){ bigMsg.textContent = txt; bigMsg.style.display='block'; bigMsg.classList.add('pulse'); setTimeout(()=>{ bigMsg.style.display='none'; bigMsg.classList.remove('pulse'); }, timeout); }

    function showConfetti(){ for(let i=0;i<40;i++){ const c = document.createElement('div'); c.className='confetti'; c.style.left = Math.random()*100 + '%'; c.style.background = i%3===0? 'var(--accent2)' : (i%2? 'var(--accent)' : 'var(--danger)'); c.style.top='-10vh'; c.style.width = (6+Math.random()*8)+'px'; c.style.height = (10+Math.random()*18)+'px'; winLayer.appendChild(c); setTimeout(()=>c.remove(),1800 + Math.random()*500); } }

    // sound toggle
    toggleSound.addEventListener('click', ()=>{ soundEnabled = !soundEnabled; toggleSound.textContent = soundEnabled? 'ايقاف الصوت' : 'تشغيل الصوت'; addLog(soundEnabled? 'تم تفعيل الصوت':'تم إيقاف الصوت'); });

    // reset persistent
    resetPersist.addEventListener('click', resetPersistent);

    // save before unload
    window.addEventListener('beforeunload', ()=>{ savePersistent(); });

    // init
    loadPersistent(); updateUI();

    // accessibility: allow Enter to open modal choices when modal shown
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && roundModal.classList.contains('show')){ // pick current turn as default
        givePoint(turn);
      }
    });
  </script>

</body>
</html>
